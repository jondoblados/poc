<!DOCTYPE html>
<html lang="en">
<head>{{ partial "head.html" . }}</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ "" | relURL }}">MBSAAS <span>POC</span></a>
      <nav>
        {{ range site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
      </nav>
    </div>
  </header>
  <main class="wrap">{{ block "main" . }}{{ end }}</main>
  <footer class="wrap site-footer">
    <p>Content is written in Google Docs and published automatically with GitHub Actions + Hugo. <a href="{{ "index.xml" | relURL }}">RSS</a></p>
  </footer>
</body>
</html>
