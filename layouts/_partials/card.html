<article class="card"><a href="{{ .RelPermalink }}"><div class="card-media">{{ with partial "cover.html" . }}<img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="" loading="lazy">{{ end }}</div><div class="card-body"><div class="card-meta">{{ range .Params.categories }}<span class="tag">{{ . }}</span>{{ end }}<span>{{ .Date.Format "2 Jan 2006" }}</span></div><h3>{{ .Title }}</h3><p>{{ .Description }}</p><span class="card-more">Read more →</span></div></a></article>
