{{ define "main" }}
{{ partial "page-hero.html" . }}
<section class="page-body"><div class="container"><div class="content hugo-content">{{ .Content }}</div>
{{ if eq .Section "posts" }}<div class="cards">{{ range .Pages }}{{ partial "card.html" . }}{{ end }}</div>
{{ else }}{{ with .Pages.ByWeight }}<div class="tiles subpages">{{ range . }}{{ partial "tile.html" . }}{{ end }}</div>{{ end }}{{ end }}
</div></section>
{{ end }}
