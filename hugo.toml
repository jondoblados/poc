baseURL = "https://jon.doblados.net/poc/"
locale = "en-SG"
title = "MBSAAS (POC)"
enableRobotsTXT = true
# Future-dated posts stay hidden until their Publish date (the daily run picks them up).
buildFuture = false
timeZone = "Asia/Singapore"

[params]
  description = "Manchester Business School Alumni Association of Singapore - website POC (Google Docs -> Hugo -> GitHub Pages)"

[markup.goldmark.renderer]
  # Never render raw HTML/scripts coming from Google Docs.
  unsafe = false

[imaging]
  [imaging.webp]
    quality = 82
  [imaging.jpeg]
    quality = 85
  resampleFilter = "Lanczos"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[taxonomies]
  category = "categories"
